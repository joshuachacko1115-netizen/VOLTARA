name: VOLTARA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q src dashboard webapp tests scripts
      - name: Test application
        run: python -m pytest -q -ra --junitxml=dist/test-results.xml
      - name: Package source distribution
        run: python scripts/package.py
      - name: Upload validated distribution and test report
        uses: actions/upload-artifact@v7
        with:
          name: voltara-${{ github.sha }}
          path: |
            dist/voltara-source.zip
            dist/test-results.xml
          if-no-files-found: error
          retention-days: 14
